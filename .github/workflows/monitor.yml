name: Daily monitor run

on:
  schedule:
    - cron: "17 5 * * *"   # every day, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["regmon/**", "sources.yaml", "rules.yaml", ".github/workflows/monitor.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tests must pass before publishing
        run: python -m pytest -q

      - name: Fetch, classify, store and render (live)
        run: python -m regmon run

      - name: Commit updated database and dashboard
        run: |
          git config user.name "regmon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regmon.sqlite docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monitor run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
